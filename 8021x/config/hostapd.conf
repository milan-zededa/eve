# Listen only on br0 (the wired test port)
interface=br0
driver=wired

# Enable IEEE 802.1X (wired authentication)
ieee8021x=1
eapol_version=2
eap_server=1

# Control interface so hostapd_cli can connect
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

# Use EAP-TLS for authentication
eap_user_file=/etc/hostapd/eap_users

# Certificates for EAP-TLS
ca_cert=/etc/certs/pnac-ca.pem
server_cert=/etc/certs/pnac-server.pem
private_key=/etc/certs/pnac-server.key
private_key_passwd=

# Optional: dynamic VLANs or ACLs could go here
# dynamic_vlan=0

logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# Allow only EAP-TLS method
eap_message=hello