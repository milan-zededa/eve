---
name: Run evetest suite
description: >-
  Runs one evetest suite on the self-hosted evetest-runner fleet. Shared by
  evetest-pr.yml (per-PR run, against a freshly built-but-unpublished PR
  image, with per-suite PR commit statuses) and evetest-nightly.yml (full run
  against master, against the image publish.yml already published for that
  commit, no PR statuses to report). The calling job must already have
  checked out the right ref before this runs (a local action like this one
  can only be resolved once its own file is present in the workspace, so
  checkout can't happen inside it) and supplies runs-on, timeout-minutes and
  (for the PR flow) permissions.

inputs:
  test-suite:
    description: Name of the evetest suite (or standalone test) to run.
    required: true
  head-sha:
    description: SHA to report PR commit statuses against. Required when post-status is 'true'.
    required: false
    default: ''
  post-status:
    description: "'true' to report this suite's progress/result as a PR commit status. Requires head-sha."
    required: false
    default: 'false'
  download-image-artifacts:
    description: >-
      'true' to download and load a freshly built EVE image from another
      workflow run's artifacts, instead of letting evetest pull whatever is
      already published for the checked-out commit.
    required: false
    default: 'false'
  source-run-id:
    description: Workflow run ID to download EVE image artifacts from. Required when download-image-artifacts is 'true'.
    required: false
    default: ''
  skip:
    description: Value for EVETEST_SKIP.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # arch/platform are fixed for evetest right now; hv varies per suite
    # (most default to kvm, but e.g. the cluster suite hard-requires
    # kubevirt -- see the "Determine EVE hypervisor for this suite" step
    # further down).
    - name: Set EVE_ARCH/EVE_PLATFORM
      shell: bash
      run: |
        echo "EVE_ARCH=amd64" >> "$GITHUB_ENV"
        echo "EVE_PLATFORM=generic" >> "$GITHUB_ENV"

    # EVETEST_BROKER_ADDRESS, EVETEST_COLLECT_ARTIFACTS,
    # EVETEST_SUITE_MAX_FAILURES and EVETEST_LOG_LEVEL (see
    # gh-runner-installer.sh) are already part of every step's process
    # environment -- the actions runner service loads them from its own
    # .env file at startup -- so plain "$EVETEST_FOO" already works in
    # every run: step below with no extra wiring. This also promotes them
    # into the GitHub Actions *expression* env context
    # (${{ env.EVETEST_FOO }}), in case a step needs that form instead.
    - name: Propagate runner EVETEST_* env vars to the job context
      shell: bash
      run: env | grep '^EVETEST_' >> "$GITHUB_ENV" || true

    # workflow_run-triggered workflows don't automatically show up as a
    # status check on the PR the way pull_request-triggered ones do, so
    # discover-suites already posted one pending status per suite; update
    # this specific one now that a runner actually picked it up.
    - name: Report pending status to the PR
      if: inputs.post-status == 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: '${{ inputs.head-sha }}',
            state: 'pending',
            context: 'Evetest / ${{ inputs.test-suite }}',
            description: 'Running...',
            target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
          });

    - name: Starting report
      shell: bash
      run: |
        echo "Test suite: ${{ inputs.test-suite }}"
        echo "GitHub event: ${{ github.event_name }}"
        echo "Run attempt: ${{ github.run_attempt }}"
        echo Disk usage
        df -h
        echo Memory
        free -m

    # gh-runner-installer.sh always writes ~/.docker/config.json on this
    # runner -- real registry credentials if --docker-username/
    # --docker-password were passed when the runner VM was created, or
    # {"auths":{}} otherwise. Either way docker already uses it
    # transparently for every pull, so there is no separate login step
    # to run; this just reports which case we're in, and is a genuine
    # no-op when no credentials were configured.
    - name: Docker login
      shell: bash
      run: |
        if jq -e '.auths | length > 0' "$HOME/.docker/config.json" >/dev/null 2>&1; then
          echo "Docker registry credentials already configured on this runner."
        else
          echo "No Docker registry credentials configured on this runner; skipping login (pulls will be unauthenticated)."
        fi

    # "PR build" publishes a separate image per hypervisor (kvm, xen, k);
    # a single suite run can exercise more than one across its own subtests/parameter
    # variants, so every one of them must be loaded, not just one picked per suite.
    # The pattern below matches all of eve-kvm-/eve-xen-/eve-k-... in one
    # step (merge-multiple flattens them into a single directory).
    - name: Download EVE image artifacts
      if: inputs.download-image-artifacts == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: eve-*-${{ env.EVE_ARCH }}-${{ env.EVE_PLATFORM }}
        run-id: ${{ inputs.source-run-id }}
        github-token: ${{ github.token }}
        path: /tmp/eve-image
        merge-multiple: true

    # build-eve tags each image "evebuild/pr:<version>-<hv>-<arch>" (see
    # .github/actions/build-eve's "Set environment"/"Export docker
    # container" steps); read the real tag back from each `docker load`'s
    # own output rather than reconstructing it, and strip the trailing
    # "-<hv>-<arch>" it appends, leaving just the version part -- evetest
    # itself appends "-<hv>-<arch>" again per test/device as needed, so
    # EVETEST_EVE_VERSION must not already carry it. Both tars are from the
    # same PR build, so they always agree on repo/version.
    #
    # Not run when download-image-artifacts is 'false' (e.g. the nightly run
    # against master): EVETEST_EVE_REPO/EVETEST_EVE_VERSION are then left
    # unset, so evetest derives them from the checkout itself (see
    # evetest/Makefile's "version" logic) and pulls whatever publish.yml
    # already published for that exact commit.
    - name: Load EVE images into docker
      if: inputs.download-image-artifacts == 'true'
      shell: bash
      run: |
        for TARFILE in /tmp/eve-image/*.tar; do
          LOADED=$(docker load -i "$TARFILE" | sed -n 's/^Loaded image: //p')
          [ -n "$LOADED" ] || { echo "::error::'docker load' did not report a loaded image for $TARFILE"; exit 1; }
          echo "Loaded EVE image: $LOADED"
          REPO="${LOADED%%:*}"
          TAG="${LOADED#*:}"
          VERSION="${TAG%-*-${EVE_ARCH}}"
          echo "EVETEST_EVE_REPO=$REPO" >> "$GITHUB_ENV"
          echo "EVETEST_EVE_VERSION=$VERSION" >> "$GITHUB_ENV"
        done

    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
      with:
        go-version-file: evetest/go.mod
        cache: false

    - name: Add GOPATH/bin to PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Install gotestfmt
      shell: bash
      run: go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest

    - name: Install evetest CLI
      shell: bash
      run: make -C evetest install-cli

    # On a workflow re-run, restore the previous attempt's artifacts (if
    # any were uploaded -- see "Upload artifacts" below) under their
    # original name so EVETEST_RESTART_ONLY_FAILED can find them, and skip
    # subtests that already passed there.
    - name: Download previous attempt's artifacts
      if: ${{ github.run_attempt > 1 }}
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: evetest-artifacts-${{ inputs.test-suite }}
        path: /tmp/prev-attempt

    - name: Restore previous attempt's artifacts
      if: ${{ github.run_attempt > 1 }}
      shell: bash
      run: |
        echo "EVETEST_RESTART_ONLY_FAILED=true" >> "$GITHUB_ENV"
        TARBALL="/tmp/prev-attempt/${{ inputs.test-suite }}.tar.gz"
        if [ -f "$TARBALL" ]; then
          tar xzf "$TARBALL" -C "$EVETEST_COLLECT_ARTIFACTS"
          echo "Restored previous attempt's artifacts from $TARBALL"
        else
          echo "No previous attempt artifact found at $TARBALL; running the full suite."
        fi

    # TestControllerFaultsSuite exercises Adam's controller-side fault
    # injection (dropped/delayed/malformed responses, etc.), which is off
    # by default so it can never affect any other suite's runs.
    - name: Enable controller fault injection for TestControllerFaultsSuite
      if: inputs.test-suite == 'TestControllerFaultsSuite'
      shell: bash
      run: echo "EVETEST_CONTROLLER_FAULTS=true" >> "$GITHUB_ENV"

    # continue-on-error so this step's own conclusion is never "failure" --
    # opening a failed job's page auto-scrolls to and expands the FIRST
    # step with conclusion=failure, and this step's raw, very long
    # line-by-line test output is a much worse place to land than "Format
    # test results" below, which is where the real failure is reported
    # instead (via steps.run_evetest.outcome, which still reflects the
    # true pass/fail regardless of this masking).
    - name: Run evetest
      id: run_evetest
      continue-on-error: true
      shell: bash
      env:
        EVETEST_SKIP: ${{ inputs.skip }}
      run: |
        set -o pipefail
        EVETEST_OUTPUT_FORMAT=json make -C evetest evetest NAME=${{ inputs.test-suite }} \
          | jq -Rrj --unbuffered '
              if startswith("{") then
                try (fromjson | .Output // empty) catch (. + "\n")
              else
                . + "\n"
              end
            '

    # Every run's artifacts land in a fresh "<suite>-<timestamp>" directory
    # under EVETEST_COLLECT_ARTIFACTS (see entrypoint.sh); the newest one
    # matching this suite is always the run that just finished, even when
    # an older, previous-attempt directory was restored above.
    - name: Locate artifact directory
      if: always()
      shell: bash
      run: |
        SUITE="${{ inputs.test-suite }}"
        DIR=$(ls -1d "${EVETEST_COLLECT_ARTIFACTS}/${SUITE}-"*/ 2>/dev/null | sort | tail -1)
        DIR="${DIR%/}"
        if [ -n "$DIR" ]; then
          echo "ARTIFACT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Located artifact dir: $DIR"
        else
          echo "No artifact directory found for suite $SUITE under $EVETEST_COLLECT_ARTIFACTS"
        fi

    # Format the saved JSON with gotestfmt for a human-readable summary.
    # This step's own conclusion is deliberately made to mirror the
    # suite's real outcome (see the final line) rather than being masked
    # with continue-on-error like "Run evetest" above -- so that on a
    # failed job, GitHub's auto-expanded step is this readable summary,
    # not that step's raw JSON-lines output.
    - name: Format test results
      if: always()
      shell: bash
      run: |
        JSON="${ARTIFACT_DIR}/gotest.json"
        if [[ -n "$ARTIFACT_DIR" && -f "$JSON" ]]; then
          cat "$JSON" | gotestfmt || true
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          jq -r 'select((.Action == "pass" or .Action == "fail" or .Action == "skip") and .Test != null)
                 | (if .Action == "pass" then "✅" elif .Action == "skip" then "⏭️ " else "❌" end) + " " + .Test
                   + if .Elapsed then " (" + (.Elapsed | tostring) + "s)" else "" end' \
            "$JSON" >> $GITHUB_STEP_SUMMARY
        else
          echo "No gotest.json found (test may have failed to start)." | tee -a $GITHUB_STEP_SUMMARY
        fi
        [ "${{ steps.run_evetest.outcome }}" = "success" ]

    - name: Coverage summary
      if: always()
      shell: bash
      run: |
        if [[ -z "$ARTIFACT_DIR" ]]; then
          echo "No artifact directory located, skipping coverage."
          exit 0
        fi
        # Build a comma-separated list of directories containing covcounters
        # files anywhere under the artifact tree, for covdata merge -i.
        COVER_DIRS=$(find "${ARTIFACT_DIR}" -type f -name "covcounters.*" \
          -exec dirname {} \; | sort -u | paste -sd,)
        if [[ -z "$COVER_DIRS" ]]; then
          echo "No coverage data found."
          exit 0
        fi
        mkdir -p /tmp/merged-coverage
        go tool covdata merge -i "$COVER_DIRS" -o /tmp/merged-coverage
        echo "### Coverage" >> $GITHUB_STEP_SUMMARY
        go tool covdata percent -i /tmp/merged-coverage | tee -a $GITHUB_STEP_SUMMARY
        go tool covdata textfmt -i /tmp/merged-coverage -o /tmp/coverage.txt
        TOTAL=$(cd pkg/pillar && go tool cover -func=/tmp/coverage.txt | tail -1)
        echo "$TOTAL"
        echo "**$TOTAL**" >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage data
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: coverage-${{ inputs.test-suite }}
        path: /tmp/merged-coverage/
        if-no-files-found: ignore

    # Package the whole EVETEST_COLLECT_ARTIFACTS tree into a single tarball,
    # named after the suite so a re-run's "Download previous attempt's artifacts"
    # step above can find it.
    # This includes this run's own fresh directory as well as any
    # older one restored above, so a subtest skipped this time via
    # EVETEST_RESTART_ONLY_FAILED still has its artifacts available.
    - name: Package artifacts
      if: failure()
      shell: bash
      run: |
        mkdir -p /tmp/upload
        tar czf "/tmp/upload/${{ inputs.test-suite }}.tar.gz" -C "$EVETEST_COLLECT_ARTIFACTS" .

    - name: Upload artifacts
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
      with:
        name: evetest-artifacts-${{ inputs.test-suite }}
        path: /tmp/upload/${{ inputs.test-suite }}.tar.gz
        if-no-files-found: ignore

    - name: Clean up artifact directory
      if: always()
      shell: bash
      run: sudo rm -fr "${EVETEST_COLLECT_ARTIFACTS:?}"/*

    - name: Report final status to the PR
      if: always() && inputs.post-status == 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
      with:
        script: |
          const outcome = '${{ steps.run_evetest.outcome }}';
          const state = outcome === 'success' ? 'success' : 'failure';
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: '${{ inputs.head-sha }}',
            state,
            context: 'Evetest / ${{ inputs.test-suite }}',
            description: state === 'success' ? 'Passed' : 'Failed',
            target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
          });
