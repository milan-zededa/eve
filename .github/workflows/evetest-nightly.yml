---
name: evetest-nightly
on:  # yamllint disable-line rule:truthy
  schedule:
    # ~2:37 AM CET (cron is UTC-only, drifts ~1h across DST -- fine for a nightly).
    - cron: '37 1 * * *'
  workflow_dispatch: {}  # manual trigger, for testing

permissions:
  contents: read
  actions: read

# TODO(milan): temporary override while testing this workflow against my own
# account/repo instead of the real lfedge/eve publish -- remove once this is
# validated and ready to run for real.
env:
  EVETEST_EVE_REPO: milan4zededa/eve

jobs:
  # Suite discovery against the checked-out branch. No Claude-skip step:
  # this run is the full-coverage safety net for evetest-pr.yml's PR-time
  # skip decisions.
  discover-suites:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - id: list
        name: List evetest test suites
        run: |
          # See evetest-pr.yml's identical step for why this filter exists.
          SUITES_JSON=$(make -C evetest list-test-suites \
              | grep -E '^Test[A-Za-z0-9_]+$' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$SUITES_JSON" = "[]" ]; then
            echo "::error::no test suites discovered; check the raw 'make -C evetest list-test-suites' output above"
            exit 1
          fi
          echo "Discovered suites: $SUITES_JSON"
          echo "suites=$SUITES_JSON" >> "$GITHUB_OUTPUT"

      # Computed once here (rather than once per matrix job below) and
      # exposed as a job output, so every suite job and the Allure publish
      # job all agree on the same version without duplicating this formula.
      - id: version
        name: Compute the EVE version to test
        run: |
          REPO_BRANCH=$(git rev-parse --abbrev-ref HEAD | tr / _)
          REPO_SHA=$(git describe --match '$^' --abbrev=8 --always --dirty)
          REPO_TAG=$(git describe --always --tags | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-lts|-rc[0-9]+)?$' || echo snapshot)
          if [ "$REPO_TAG" = "snapshot" ]; then
            DIRTY=""
            case "$REPO_SHA" in *-dirty) DIRTY="-$(date -u +"%Y-%m-%d.%H.%M")" ;; esac
            VERSION="0.0.0-${REPO_BRANCH}-${REPO_SHA}${DIRTY}"
          else
            VERSION="$REPO_TAG"
          fi
          # DO NOT MERGE: pin to a known-published version so this doesn't
          # need a fresh publish.yml build every time master's tip moves
          # while testing.
          VERSION="0.0.0-master-0408b69f"
          echo "Computed EVE version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # One job per suite, on the same evetest-runner fleet as evetest-pr.yml.
  # No image build/download: pulls whatever publish.yml already published
  # for this commit (EVETEST_EVE_VERSION computed explicitly below).
  evetest:
    name: Run suite ${{ matrix.test-suite }}
    needs: discover-suites
    runs-on: [self-hosted, evetest-runner]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        test-suite: ${{ fromJson(needs.discover-suites.outputs.suites) }}
    steps:
      # A local composite action needs its file already checked out, so wipe
      # the workspace before checkout here, not from inside the action.
      - name: Clean stale state from previous runs
        run: |
          sudo rm -fr "$GITHUB_WORKSPACE" && mkdir "$GITHUB_WORKSPACE"
          rm -fr ~/.linuxkit
          docker rm -f $(docker ps -aq) && docker volume rm -f $(docker volume ls -q) || :
          docker system prune --all --force --volumes
          mkdir -p "$EVETEST_COLLECT_ARTIFACTS"
          # May be root-owned if a previous run was killed mid-way.
          sudo rm -fr "${EVETEST_COLLECT_ARTIFACTS:?}"/*
          # Self-hosted runner: /tmp isn't wiped between jobs.
          rm -rf /tmp/eve-image /tmp/prev-attempt /tmp/upload /tmp/merged-coverage /tmp/coverage.txt

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      # Left unset, evetest would call `make version` itself -- on a fresh
      # checkout that regenerates pkg-deps.mk, leaking a huge build trace
      # into the value and corrupting evetest's own docker run command.
      # Version is computed once in discover-suites and shared from there.
      - name: Set the EVE version to test
        run: echo "EVETEST_EVE_VERSION=${{ needs.discover-suites.outputs.version }}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/evetest-run-suite
        with:
          test-suite: ${{ matrix.test-suite }}
          download-image-artifacts: 'false'
          post-status: 'false'
          upload-junit-results: 'true'
          analyze-failures: 'true'
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          branch: ${{ github.ref_name }}
          ledger-branch: ${{ github.ref_name }}

  # Combines every suite's JUnit results into one Allure report, appends a
  # ledger entry summarizing any failures, and publishes both to GitHub
  # Pages (gh-pages branch, under test/<branch>/) in one commit. Carries
  # forward the previous report's history/ folder so Allure can render
  # pass/fail trend and flakiness across nightly runs. Runs even if some
  # suites failed -- that's exactly what this is meant to track -- and on
  # plain ubuntu-latest, since none of this needs the scarce evetest-runner
  # fleet.
  publish-report:
    needs: [discover-suites, evetest]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every branch this workflow runs against gets its own subtree under
      # one test/ namespace, leaving the rest of gh-pages free for anything
      # unrelated to test reports.
      - name: Compute the test-report subdirectory for this branch
        run: echo "TEST_DIR=test/${{ github.ref_name }}" >> "$GITHUB_ENV"

      # merge-multiple flattens every suite's artifact into one directory --
      # required, since allure generate doesn't scan nested subdirectories.
      # Safe because each suite's XML is named after the suite itself (see
      # evetest-run-suite/action.yml), so filenames can't collide.
      - name: Download every suite's JUnit results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: junit-*
          path: allure-results
          merge-multiple: true

      # The branch may not exist yet on the very first run.
      - name: Check out gh-pages
        id: checkout_gh_pages
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: gh-pages
          path: gh-pages

      - name: Initialize an empty gh-pages branch (first run only)
        if: steps.checkout_gh_pages.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout above already created gh-pages/.git with an
          # "origin" remote before its fetch of the (nonexistent) gh-pages
          # ref failed, so `remote add` alone would collide with that.
          mkdir -p gh-pages
          git -C gh-pages init -b gh-pages
          # `-b gh-pages` above is ignored when checkout already left a repo
          # behind (its "re-init" warning) -- force HEAD to gh-pages
          # regardless, since the later `git push origin gh-pages` needs a
          # local branch of that exact name to push.
          git -C gh-pages symbolic-ref HEAD refs/heads/gh-pages
          URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git -C gh-pages remote add origin "$URL" 2>/dev/null \
            || git -C gh-pages remote set-url origin "$URL"

      - name: Carry forward Allure history
        run: cp -r "gh-pages/$TEST_DIR/history" allure-results/history 2>/dev/null || true

      # Lets the report's Executors widget (and, via buildOrder, the Trend
      # graphs' x-axis) identify each run -- Allure only accepts a plain
      # incrementing number for buildOrder, so the EVE version goes in
      # buildName instead, shown on the Executors widget/tooltip. reportUrl
      # points at this run's own archived snapshot (see "Archive this run's
      # report snapshot" below), which is what makes Trend graph points and
      # each test's History tab entries clickable.
      - name: Create executor.json
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          cat <<EOF > allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "${{ needs.discover-suites.outputs.version }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}",
            "buildOrder": ${{ github.run_number }},
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${REPO_NAME}/${TEST_DIR}/runs/${{ github.run_number }}"
          }
          EOF

      - name: Install Allure CLI
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Allure report
        run: |
          curl -fsSL -o allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.46.0/allure-2.46.0.tgz
          tar xzf allure.tgz
          ./allure-2.46.0/bin/allure generate --clean -o allure-report allure-results

      # Full immutable copy of this run's report, kept forever, so the Trend
      # graph points and each test's History tab entries (which link to
      # executor.json's reportUrl, see above) resolve to something real
      # instead of 404ing. Cheap to keep indefinitely: assets/ (the only
      # sizeable part of a report) is de-duplicated below, so each snapshot
      # is only the small per-run data/widgets/history, and git itself
      # further de-duplicates identical blobs (e.g. re-published history/
      # files) across commits.
      #
      # assets/ (the bundled Allure frontend JS/CSS, ~2MB) is identical
      # across every run of the same Allure CLI version -- GitHub Pages
      # doesn't support symlinks, so instead each snapshot's index.html is
      # rewritten to reference the one shared assets/ copy already sitting
      # at this branch's test/<branch>/ root (kept fresh by the "Publish to
      # GitHub Pages" step below) rather than getting its own -- runs/<N>/
      # is 2 levels below that root either way, hence "../../assets/".
      # Revisit this rewrite if a future Allure release changes how it
      # emits these references.
      - name: Archive this run's report snapshot
        run: |
          DEST="gh-pages/$TEST_DIR/runs/${{ github.run_number }}"
          mkdir -p "$DEST"
          cp -r allure-report/. "$DEST/"
          rm -rf "$DEST/assets"
          sed -i -E 's#"assets/#"../../assets/#g' "$DEST/index.html"

      # Downloaded separately from junit-* (not merge-multiple'd into the
      # same directory): every artifact contains a same-named
      # claude-execution-output.json, so each needs to land in its own
      # claude-analysis-<suite>/ subdirectory -- the default
      # download-artifact behavior for a pattern match.
      - name: Download every suite's Claude failure analysis
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: claude-analysis-*
        continue-on-error: true

      # One Markdown section per nightly run, listing only suites that
      # failed (identified by having a Claude analysis artifact at all,
      # since that step only ever runs on failure) -- both the literal
      # failure text (from the JUnit XML already downloaded above) and
      # Claude's narrative conclusion, so a later Claude pass over this
      # whole file can spot patterns across many nights without needing to
      # re-fetch or re-derive anything.
      - name: Append this run's failures to the nightly ledger
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          version = "${{ needs.discover-suites.outputs.version }}"
          run_number = "${{ github.run_number }}"
          run_id = "${{ github.run_id }}"
          branch = "${{ github.ref_name }}"
          owner, repo_name = "${{ github.repository }}".split("/")
          run_url = f"https://github.com/{owner}/{repo_name}/actions/runs/{run_id}"
          report_url = f"https://{owner}.github.io/{repo_name}/test/{branch}/runs/{run_number}/"
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          # gotestsum always sets message="Failed" verbatim -- the actual
          # failure text is in the element's captured-stdout body instead,
          # anchored on evetest's own "TEST FAILURE:" convention (or Go's
          # "panic:") and cut off before the STACKTRACE dump that follows it.
          def extract_failure_text(node):
              if node is None or not node.text:
                  return ""
              lines = node.text.splitlines()
              marker_idx = next((i for i, l in enumerate(lines) if "TEST FAILURE:" in l or "panic:" in l), None)
              if marker_idx is None:
                  return ""
              collected = []
              for line in lines[marker_idx:marker_idx + 6]:
                  if "STACKTRACE:" in line:
                      break
                  stripped = line.strip()
                  if stripped:
                      collected.append(stripped)
              return " ".join(collected)[:300] if collected else ""

          # Every failing testcase, not just the first one found -- a suite
          # commonly has several independent subtest failures in one run.
          def extract_test_failures(xml_path):
              if not os.path.exists(xml_path):
                  return []
              try:
                  tree = ET.parse(xml_path)
              except ET.ParseError:
                  return []
              results = []
              for testcase in tree.getroot().iter("testcase"):
                  name = testcase.get("name", "?")
                  # gotestsum also emits a synthetic roll-up testcase named
                  # after the suite itself (the parent Go test function's
                  # own aggregate result) -- not a real subtest, skip it.
                  if "/" not in name:
                      continue
                  fail_node = testcase.find("failure")
                  if fail_node is None:
                      fail_node = testcase.find("error")
                  if fail_node is None:
                      continue
                  subtest = name.split("/", 1)[1]
                  results.append((subtest, extract_failure_text(fail_node)))
              return results

          # Claude's own conclusion often starts with its own "## Heading";
          # demote every heading in it so the shallowest lands one level
          # below this ledger's own "#### Claude's conclusion" heading,
          # instead of colliding with it.
          def demote_headings(text, min_depth=5):
              lines = text.splitlines()
              depths = [len(m.group(1)) for m in (re.match(r"^(#{1,6})(\s|$)", l) for l in lines) if m]
              if not depths:
                  return text
              shift = max(0, min_depth - min(depths))
              if shift == 0:
                  return text
              prefix = "#" * shift
              return "\n".join(
                  prefix + l if re.match(r"^(#{1,6})(\s|$)", l) else l
                  for l in lines
              )

          entries = []
          for path in sorted(glob.glob("claude-analysis-*/claude-execution-output.json")):
              suite = os.path.basename(os.path.dirname(path))[len("claude-analysis-"):]
              with open(path) as f:
                  messages = json.load(f)
              results = [m for m in messages if m.get("type") == "result"]
              conclusion = results[-1].get("result", "_No result recorded._") if results else "_No result recorded._"
              failures = extract_test_failures(f"allure-results/{suite}.xml")
              entries.append((suite, failures, conclusion))

          if not entries:
              print("No failing suites with a Claude analysis; nothing to append.")
          else:
              lines = [f"## [{date} -- {version} (run #{run_number})]({run_url})", "", f"[Full report]({report_url})", ""]
              for suite, failures, conclusion in entries:
                  lines.append(f"### {suite}")
                  lines.append("")
                  if failures:
                      lines.append("#### Failures")
                      for subtest, text in failures:
                          lines.append(f"- `{subtest}`: `{text}`" if text else f"- `{subtest}`")
                      lines.append("")
                  lines.append("#### Claude's conclusion")
                  lines.append("")
                  lines.append(demote_headings(conclusion))
                  lines.append("")
              section = "\n".join(lines) + "\n"

              # Newest run first: insert the new section right after the
              # header, ahead of every previously recorded run.
              header = "# Evetest Nightly Ledger\n\nOne section per nightly run with at least one failing suite.\n\n"
              ledger_path = f"gh-pages/test/{branch}/NIGHTLY-LEDGER.md"
              os.makedirs(os.path.dirname(ledger_path), exist_ok=True)
              if os.path.exists(ledger_path):
                  with open(ledger_path) as f:
                      existing = f.read()
                  body = existing[len(header):] if existing.startswith(header) else existing
              else:
                  body = ""
              with open(ledger_path, "w") as f:
                  f.write(header + section + body)
              print(f"Inserted ledger entry for {len(entries)} failing suite(s).")
          PYEOF

      - name: Publish to GitHub Pages
        run: |
          mkdir -p "gh-pages/$TEST_DIR"
          rsync -a --delete --exclude=runs --exclude=NIGHTLY-LEDGER.md allure-report/ "gh-pages/$TEST_DIR/"
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Update test report for ${{ github.ref_name }} @ ${{ github.sha }}"
          git push origin gh-pages
